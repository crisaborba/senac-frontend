<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão Acadêmica</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="system-update.png" type="image/x-icon">
</head>
<body>
    <head>
        <h2>
            MANUTENÇÃO DE USUÁRIOS DO SISTEMA INTERNO
        </h2>
    </head>
    <main>
    Login <input type="email"> <br>
    Senha <input type="password"> <br>
    Status <select>
            <option>Ativo</option>
            <option>Inativo</option>
    </select> <br>
    Tipo <input type="radio" name="tipo"> Técnico <input type="radio" name="tipo"> Professor <input type="radio" name="tipo"> Aluno <br>

    Data de criação <input type="data"> <br>

    Perfil <input type="radio" name="perfil"> Convidado <input type="radio" name="perfil"> Administrador <br>
    Observações <textarea name="" id=""></textarea><br>

    Módulos <input type="checkbox"> Compras <input type="checkbox"> Biblioteca <input type="checkbox"> Acadêmico <input type="checkbox"> Documentação <input type="checkbox"> Recursos humanos
    </main>
    <footer>
        <input type="button" value="Cadastrar">
        <input type="button" value="Excluir">
    </footer>
</body>
</html>
